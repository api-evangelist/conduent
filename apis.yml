description: 'Conduent Incorporated (Nasdaq: CNDT) is a US business process services and solutions company
  headquartered in Florham Park, New Jersey, delivering customer experience management, finance and procurement,
  human capital, integrated digital solutions, legal and compliance analytics, government and Medicaid
  services, transportation and tolling, banking and lending, and healthcare business solutions. Its work
  is sold as managed services and BPO engagements rather than as a self-serve software product: Conduent
  publishes no developer portal, no API reference and no machine-readable contract, and programmatic access
  is provisioned inside enterprise services contracts. The one publicly documented interface is the webhook
  event catalog of its Knowledge Connection learning platform.'
