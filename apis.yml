apis:
- aid: conduent:conduent-knowledge-connection
  name: Conduent Knowledge Connection
  tags:
  - Learning
  - Webhooks
  - Technology
  - Business Process Services
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{portal}.knowledgeconnection.conduent.com
  humanURL: https://help.knowledgeconnection.conduent.info/
  description: 'Knowledge Connection (marketed to learners as Learner Community) is Conduent''s learning
    platform, deployed one portal per customer on a subdomain of knowledgeconnection.conduent.com; the
    base URL is templated because the tenant segment is required (the apex does not resolve; pmi.knowledgeconnection.conduent.com
    returns HTTP 200). It is the only Conduent product with an anonymously readable integration surface:
    eight documented webhook events, a contract-granted partner Request Launch URL call, and LTI, xAPI/TinCan,
    SCORM/AICC and SAML 2.0 support. Event names and trigger semantics are public; payload schemas, signing
    and retry behaviour are not, and no OpenAPI or AsyncAPI is published.'
  properties:
